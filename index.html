<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="./style.css">

</head>

<body>
    <div class="container">
        <h1>To-Do List</h1>

        <div class="inputBox">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            <button id="addBtn">
                Add
            </button>
        </div>
        <div class="filters">
            <button class="filter" data-filter="all">
                all
            </button>
            <button class="filter" data-filter="active">
                Active
            </button>
            <button class="filter" data-filter="completed">
                Completed
            </button>
        </div>
        <div id="taskList">

        </div>
        <div class="footer">
            <p id="count">
                0 tasks completed
            </p>
            <button id="clearBtn">
                Clear completed
            </button>
        </div>
    </div>
    <script src="./script.js"></script>


</body>

</html>
